[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "programming-files-manager"
version = "0.1.0"
description = "Create course programming files from reusable templates."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "programming-files-manager contributors" }]
keywords = ["education", "templates", "tkinter", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
pfm = "programming_files_manager.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
