# ============================================================
#  prog-file-manager — pyproject.toml
#  src-layout + setuptools + entry point + pytest + mypy + ruff
# ============================================================

# ---------- 1. Build 系統 ----------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------- 2. 套件元資料 ----------
[project]
name = "programming-files-manager"
version = "0.1.0"
description = "Generate programming assignment files from templates (GUI + CLI)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "yauandyau", email = "1155257402@link.cuhk.edu.hk" },
]
keywords = ["education", "template", "tkinter", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications",
    "Topic :: Education",
]

# 執行時依賴：本專案只用標準庫（csv / json / tkinter / argparse）。
dependencies = []

# ---------- 3. 可選依賴 ----------
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

# ---------- 4. 命令列入口 ----------
[project.scripts]
pfm = "prog_file_manager.cli:main"

# ---------- 5. 告訴 setuptools 原始碼在 src/ ----------
[tool.setuptools.packages.find]
where = ["src"]
include = ["prog_file_manager*"]

# ---------- 6. pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# 若要跳過需要圖形介面的測試：
markers = [
    "gui: tests that require a display / tkinter",
]

# ---------- 7. coverage ----------
[tool.coverage.run]
source = ["prog_file_manager"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ---------- 8. mypy ----------
[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# GUI 模組的 tkinter 型別 stub 在 Windows/Linux 上不完全一致，
# 這裡先放寬，避免 CI 紅燈。
[[tool.mypy.overrides]]
module = "prog_file_manager.gui.*"
disallow_untyped_defs = false

# ---------- 9. ruff（linter + formatter） ----------
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]   # 由 formatter 處理行長

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # 允許 assert
